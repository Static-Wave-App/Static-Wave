packages:
  - apps/*
  - packages/*
# react-native-track-player 4.1.2 is the latest release and is built against
# RN 0.68. On RN 0.86 `Arguments.fromBundle` requires a non-null Bundle, but
# `Track.originalItem` is nullable, so MusicModule.kt fails to compile.
# The patch makes those two call sites null-safe.
patchedDependencies:
  react-native-track-player@4.1.2: patches/react-native-track-player@4.1.2.patch
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  lucide-react: ^1.27.0
  next-themes: ^0.4.6
  sonner: ^2.0.7
  "@tailwindcss/postcss": ^4.3.3
  "@types/react-dom": ^19.2.3
  tailwindcss: ^4.3.3
  tailwind-merge: ^3.6.0
minimumReleaseAgeExclude:
  - expo-image@57.0.2
